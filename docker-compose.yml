name: neuro-notes-plugins

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuro_notes_plugins}
      POSTGRES_USER: ${POSTGRES_USER:-neuro_notes_plugins}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [marketplace]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [marketplace]

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: dependencies
    command: ["yarn", "db:migrate"]
    environment: &app-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql://neuro_notes_plugins:change-me@postgres:5432/neuro_notes_plugins}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NUXT_DATABASE_URL: ${DATABASE_URL:-postgresql://neuro_notes_plugins:change-me@postgres:5432/neuro_notes_plugins}
      NUXT_REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NUXT_BACKEND_BASE_URL: ${NUXT_BACKEND_BASE_URL:-http://host.docker.internal:5001}
      NUXT_GITHUB_TOKEN: ${NUXT_GITHUB_TOKEN:-}
      NUXT_SESSION_ENCRYPTION_KEY: ${NUXT_SESSION_ENCRYPTION_KEY:-development-only-session-key-change-me}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [marketplace]

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      target: runtime
    environment:
      <<: *app-environment
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: unless-stopped
    networks: [marketplace]

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
      target: runtime
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/docs/ru/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    networks: [marketplace]

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      docs:
        condition: service_healthy
    volumes:
      - ./infra/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    networks: [marketplace]

volumes:
  postgres-data:
  redis-data:

networks:
  marketplace:
    driver: bridge
